<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بارستا بوك</title>
<link rel="icon" href="data:," />
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Noto Kufi Arabic', 'sans-serif'], mono: ['Space Mono', 'monospace'] },
        colors: {
          background: '#f4f7f5',
          foreground: '#1c2e24',
          border: '#d7e0da',
          card: '#ffffff',
          primary: '#2f6b52',
          'primary-foreground': '#f8f2e4',
          secondary: '#e5ede8',
          muted: '#e8ede9',
          'muted-foreground': '#65746c',
          accent: '#eec96e',
          'accent-foreground': '#254634',
          destructive: '#c0392b',
          sidebar: '#1c2e24',
        }
      }
    }
  }
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: 'Noto Kufi Arabic', sans-serif; background: #f4f7f5; }
  .font-mono { font-family: 'Space Mono', monospace; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const API = "/api";
const recipeSections = [
  "Hot Bar — البار الساخن",
  "Cold Bar — البار البارد",
  "المخبوزات والحلويات — Desserts & Bakery",
  "الصوصات والإضافات — Toppings & Sauces",
];

function sectionLabel(section) {
  const [first, second] = (section || "").split(" — ");
  if (!second) return section;
  return /[\u0600-\u06ff]/.test(first) ? first : second;
}

// ---------- Toast (تنبيهات بسيطة بدل مكتبة كاملة) ----------
function useToast() {
  const [toasts, setToasts] = useState([]);
  const notify = (title, description, variant) => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, title, description, variant }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3500);
  };
  const ToastHost = () => (
    <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-[90%] max-w-sm">
      {toasts.map((t) => (
        <div key={t.id} className={`rounded-xl px-4 py-3 shadow-lg text-sm ${t.variant === "destructive" ? "bg-destructive text-white" : "bg-primary text-primary-foreground"}`}>
          <p className="font-bold">{t.title}</p>
          {t.description && <p className="text-xs opacity-90 mt-0.5">{t.description}</p>}
        </div>
      ))}
    </div>
  );
  return { notify, ToastHost };
}

// ---------- API helpers ----------
async function apiGet(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error("request failed");
  return res.json();
}
async function apiSend(path, method, body) {
  const res = await fetch(API + path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok && res.status !== 204) throw new Error("request failed");
  if (res.status === 204) return null;
  return res.json();
}

// ---------- Icons (بسيطة، بدل مكتبة أيقونات كاملة) ----------
const Icon = ({ d, className = "h-4 w-4" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
    <path d={d} />
  </svg>
);
const icons = {
  home: "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",
  settings: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z",
  plus: "M12 5v14M5 12h14",
  heart: "M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z",
  search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35",
  x: "M18 6 6 18M6 6l18 12",
  arrowLeft: "M19 12H5M12 19l-7-7 7-7",
  arrowRight: "M5 12h14M12 5l7 7-7 7",
  check: "M20 6 9 17l-5-5",
  pencil: "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z",
  trash: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6",
  upload: "M4 14.9A5 5 0 0 1 6 5.3 6 6 0 0 1 17.8 7 4.5 4.5 0 0 1 17 16H7a3 3 0 0 1-3-1.1z M12 12v6m0-6-3 3m3-3 3 3",
  alert: "M12 9v4M12 17h.01M10.3 3.9 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",
  clock: "M12 6v6l4 2M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z",
  filter: "M4 4h16l-6 8v6l-4 2v-8z",
  timerReset: "M12 6v6l4 2M21 12a9 9 0 1 1-4-7.5",
  list: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
  coffee: "M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z M6 1v3M10 1v3M14 1v3",
};

// ---------- Recipe image ----------
function RecipeImage({ src, alt, className = "" }) {
  if (!src) {
    return (
      <div className={`grid place-items-center bg-secondary text-primary/40 ${className}`}>
        <Icon d={icons.coffee} className="h-8 w-8" />
      </div>
    );
  }
  return <img src={src} alt={alt} className={`object-cover ${className}`} />;
}

// ---------- Shell ----------
function Shell({ view, setView, children }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const isHome = view.name === "home";
  const isSettings = view.name === "settings";

  const NavItem = ({ target, icon, label, active, onClick }) => (
    <button
      onClick={onClick || (() => setView({ name: target }))}
      className={`flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold w-full text-right transition-colors ${active ? "bg-white/10 text-accent" : "text-white/65 hover:bg-white/5"}`}
    >
      <span className="grid h-7 w-7 place-items-center"><Icon d={icon} /></span>
      {label}
    </button>
  );

  return (
    <div className="min-h-[100dvh] bg-background text-foreground">
      <div className="mx-auto flex min-h-[100dvh] max-w-[1200px] flex-col lg:flex-row-reverse">
        <aside className="hidden w-[220px] shrink-0 bg-sidebar px-5 py-7 text-white lg:flex lg:flex-col">
          <div className="flex items-center gap-3">
            <span className="grid h-11 w-11 place-items-center rounded-2xl bg-accent text-accent-foreground"><Icon d={icons.coffee} className="h-5 w-5" /></span>
            <span className="text-sm font-bold">بارستا بوك</span>
          </div>
          <div className="mt-10 space-y-1">
            <NavItem target="home" icon={icons.home} label="الرئيسية" active={isHome} />
            <NavItem target="settings" icon={icons.settings} label="الإعدادات" active={isSettings} />
          </div>
        </aside>

        <header className="sticky top-0 z-30 flex h-[64px] items-center justify-between border-b border-border bg-background/90 px-4 backdrop-blur lg:hidden">
          <button onClick={() => setMenuOpen((o) => !o)} className="grid h-10 w-10 place-items-center rounded-xl border border-border bg-card text-primary">
            <Icon d={menuOpen ? icons.x : icons.list} />
          </button>
          <button onClick={() => setView({ name: "home" })} className="flex items-center gap-2">
            <span className="grid h-9 w-9 place-items-center rounded-full bg-secondary text-primary"><Icon d={icons.coffee} className="h-4 w-4" /></span>
            <span className="text-sm font-bold">بارستا بوك</span>
          </button>
          <span className="w-10" />
        </header>
        {menuOpen && (
          <div className="fixed inset-x-4 top-[72px] z-40 rounded-2xl border border-border bg-card p-2 shadow-lg lg:hidden">
            <NavItem target="home" icon={icons.home} label="الرئيسية" active={isHome} onClick={() => { setView({ name: "home" }); setMenuOpen(false); }} />
            <NavItem target="settings" icon={icons.settings} label="الإعدادات" active={isSettings} onClick={() => { setView({ name: "settings" }); setMenuOpen(false); }} />
          </div>
        )}

        <main className="min-w-0 flex-1 pb-24 lg:pb-0">{children}</main>

        <nav className="fixed inset-x-0 bottom-0 z-30 grid h-[70px] grid-cols-3 border-t border-border bg-card/95 px-4 pb-2 pt-2 backdrop-blur lg:hidden">
          <button onClick={() => setView({ name: "home" })} className={`flex flex-col items-center justify-center gap-1 text-[10px] font-semibold ${isHome ? "text-primary" : "text-muted-foreground"}`}>
            <Icon d={icons.home} /> الرئيسية
          </button>
          <button onClick={() => setView({ name: "new" })} className="flex flex-col items-center justify-center gap-1 text-[10px] font-semibold text-muted-foreground">
            <Icon d={icons.plus} /> إضافة
          </button>
          <button onClick={() => setView({ name: "settings" })} className={`flex flex-col items-center justify-center gap-1 text-[10px] font-semibold ${isSettings ? "text-primary" : "text-muted-foreground"}`}>
            <Icon d={icons.settings} /> الإعدادات
          </button>
        </nav>
      </div>
    </div>
  );
}

function PageHeading({ eyebrow, title, description, action }) {
  return (
    <div className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        {eyebrow && <p className="mb-2 font-mono text-[10px] font-bold tracking-[.2em] text-primary">{eyebrow}</p>}
        <h1 className="text-2xl font-bold sm:text-3xl">{title}</h1>
        {description && <p className="mt-2 max-w-lg text-sm leading-7 text-muted-foreground">{description}</p>}
      </div>
      {action}
    </div>
  );
}

function StatStrip({ summary }) {
  const stats = [
    { value: summary?.recipeCount ?? 0, label: "وصفة جاهزة", icon: icons.coffee },
    { value: summary?.sectionCount ?? 0, label: "أقسام", icon: icons.list },
    { value: summary?.favoriteCount ?? 0, label: "في المفضلة", icon: icons.heart },
    { value: summary?.recentCount ?? 0, label: "شوهدت مؤخرًا", icon: icons.clock },
  ];
  return (
    <div className="grid grid-cols-2 gap-2.5 sm:grid-cols-4">
      {stats.map((s) => (
        <div key={s.label} className="flex items-center gap-3 rounded-2xl border border-border bg-card px-3 py-3.5">
          <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-secondary text-primary"><Icon d={s.icon} /></span>
          <span className="min-w-0">
            <strong className="block font-mono text-lg leading-none text-primary">{s.value}</strong>
            <span className="mt-1 block truncate text-[10px] text-muted-foreground">{s.label}</span>
          </span>
        </div>
      ))}
    </div>
  );
}

function RecipeCard({ recipe, onFavorite, onOpen }) {
  return (
    <article onClick={onOpen} className="group relative flex min-h-[122px] cursor-pointer flex-row-reverse gap-3 rounded-2xl border border-border bg-card p-2.5 transition-all hover:-translate-y-0.5 hover:shadow-md">
      <RecipeImage src={recipe.imageUrl} alt={recipe.title} className="h-[100px] w-[100px] shrink-0 rounded-xl" />
      <div className="flex min-w-0 flex-1 flex-col justify-between px-1 py-1">
        <div className="min-w-0">
          <span className="truncate font-mono text-[9px] font-bold uppercase tracking-wider text-primary">{sectionLabel(recipe.section)}</span>
          <h3 className="truncate text-sm font-bold">{recipe.title}</h3>
          <p className="mt-1 truncate text-[11px] text-muted-foreground">{(recipe.meta || []).join(" · ") || "وصفة البار الأساسية"}</p>
        </div>
        <div className="flex items-center justify-between text-[10px] text-muted-foreground">
          <span className="flex items-center gap-1"><Icon d={icons.list} className="h-3.5 w-3.5" /> {(recipe.steps || []).length} خطوات</span>
          <span className="flex items-center gap-1 text-primary">عرض الوصفة <Icon d={icons.arrowLeft} className="h-3 w-3" /></span>
        </div>
      </div>
      <button onClick={(e) => { e.stopPropagation(); onFavorite(); }} className="absolute left-3 top-3 grid h-7 w-7 place-items-center rounded-lg bg-card/85 text-muted-foreground backdrop-blur">
        <Icon d={icons.heart} className={`h-4 w-4 ${recipe.isFavorite ? "fill-accent text-accent-foreground" : ""}`} />
      </button>
    </article>
  );
}

function EmptyState({ search, onAdd }) {
  return (
    <div className="rounded-[26px] border border-dashed border-border bg-card/60 px-6 py-14 text-center">
      <span className="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-secondary text-primary"><Icon d={icons.coffee} className="h-6 w-6" /></span>
      <h3 className="mt-5 text-base font-bold">{search ? "لم نجد وصفة بهذا الاسم" : "المكتبة ما زالت هادئة"}</h3>
      <p className="mx-auto mt-2 max-w-xs text-xs leading-6 text-muted-foreground">{search ? "جرّب كلمة أقصر، أو ابحث عن مكوّن." : "ابدأ بإضافة وصفتك الأولى."}</p>
      <button onClick={onAdd} className="mt-5 inline-flex items-center gap-2 rounded-xl bg-primary px-4 py-2.5 text-xs font-bold text-primary-foreground"><Icon d={icons.plus} className="h-4 w-4" /> إضافة وصفة</button>
    </div>
  );
}

function ErrorState({ onRetry }) {
  return (
    <div className="rounded-2xl border border-destructive/20 bg-destructive/5 px-5 py-8 text-center">
      <Icon d={icons.alert} className="mx-auto h-7 w-7 text-destructive" />
      <p className="mt-3 text-sm font-bold">تعذر تحميل الوصفات</p>
      <button onClick={onRetry} className="mt-4 inline-flex items-center gap-2 rounded-xl border border-border bg-card px-4 py-2 text-xs font-bold"><Icon d={icons.timerReset} className="h-3.5 w-3.5" /> إعادة المحاولة</button>
    </div>
  );
}

// ---------- Library (home) ----------
function LibraryPage({ setView, notify }) {
  const [search, setSearch] = useState("");
  const [section, setSection] = useState("الكل");
  const [view, setViewFilter] = useState("all");
  const [recipes, setRecipes] = useState(null);
  const [summary, setSummary] = useState(null);
  const [error, setError] = useState(false);

  const load = () => {
    setError(false);
    const params = new URLSearchParams();
    if (search.trim()) params.set("search", search.trim());
    if (section !== "الكل") params.set("section", section);
    if (view !== "all") params.set("view", view);
    apiGet("/recipes?" + params.toString()).then(setRecipes).catch(() => setError(true));
  };

  useEffect(() => { load(); }, [search, section, view]);
  useEffect(() => { apiGet("/dashboard-summary").then(setSummary).catch(() => {}); }, [recipes]);

  const sectionOptions = summary?.sections?.length
    ? ["الكل", ...summary.sections]
    : ["الكل", ...recipeSections];

  const handleFavorite = (recipe) => {
    apiSend(`/recipes/${recipe.id}/favorite`, "POST").then(load).catch(() => notify("تعذر تحديث المفضلة", "", "destructive"));
  };

  return (
    <div className="min-h-[100dvh] px-4 py-6 sm:px-8 sm:py-9 lg:px-10">
      <div className="mx-auto max-w-[1000px] space-y-6">
        <PageHeading
          eyebrow="BARISTA KNOWLEDGE SYSTEM"
          title="كل وصفة في مكانها الصحيح"
          description="ابحث عن أي وصفة وراجع المقادير وخطوات التحضير بسهولة."
          action={
            <button onClick={() => setView({ name: "new" })} className="inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-primary px-4 text-sm font-bold text-primary-foreground">
              <Icon d={icons.plus} className="h-4 w-4" /> إضافة وصفة
            </button>
          }
        />

        <div className="relative">
          <Icon d={icons.search} className="pointer-events-none absolute right-4 top-1/2 h-5 w-5 -translate-y-1/2 text-primary" />
          <input value={search} onChange={(e) => setSearch(e.target.value)} type="search" placeholder="ابحث عن مشروب أو مكوّن..." className="h-13 w-full rounded-2xl border border-border bg-card py-3.5 pr-12 pl-12 text-sm outline-none focus:ring-4 focus:ring-primary/15" />
          {search && <button onClick={() => setSearch("")} className="absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground"><Icon d={icons.x} className="h-4 w-4" /></button>}
        </div>

        <div className="flex gap-2 overflow-x-auto pb-1">
          {sectionOptions.map((s) => (
            <button key={s} onClick={() => setSection(s)} className={`shrink-0 rounded-xl border px-4 py-2.5 text-xs font-semibold ${section === s ? "border-primary bg-primary text-primary-foreground" : "border-border bg-card text-muted-foreground"}`}>
              {sectionLabel(s)}
            </button>
          ))}
        </div>

        <StatStrip summary={summary} />

        <div className="flex items-center justify-between pt-2">
          <h2 className="text-lg font-bold">{view === "favorites" ? "المفضلة" : view === "recent" ? "الأخيرة" : "كل الوصفات"}</h2>
          <div className="flex items-center gap-1 rounded-xl bg-secondary p-1">
            <button onClick={() => setViewFilter("all")} className={`rounded-lg px-2.5 py-1.5 text-[10px] font-bold ${view === "all" ? "bg-card text-primary shadow" : "text-muted-foreground"}`}>الكل</button>
            <button onClick={() => setViewFilter("favorites")} className={`rounded-lg px-2.5 py-1.5 text-[10px] font-bold ${view === "favorites" ? "bg-card text-primary shadow" : "text-muted-foreground"}`}>المفضلة</button>
            <button onClick={() => setViewFilter("recent")} className={`rounded-lg px-2.5 py-1.5 text-[10px] font-bold ${view === "recent" ? "bg-card text-primary shadow" : "text-muted-foreground"}`}>الأخيرة</button>
          </div>
        </div>

        {recipes === null && !error && <div className="grid gap-3 sm:grid-cols-2">{[0,1,2,3].map(i => <div key={i} className="h-[122px] rounded-2xl bg-secondary animate-pulse" />)}</div>}
        {error && <ErrorState onRetry={load} />}
        {recipes && recipes.length === 0 && <EmptyState search={search} onAdd={() => setView({ name: "new" })} />}
        {recipes && recipes.length > 0 && (
          <div className="grid gap-3 sm:grid-cols-2">
            {recipes.map((r) => (
              <RecipeCard key={r.id} recipe={r} onFavorite={() => handleFavorite(r)} onOpen={() => setView({ name: "detail", id: r.id })} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Recipe detail ----------
function InfoSection({ title, icon, items, numbered = false, accent = "green" }) {
  return (
    <section className="rounded-2xl border border-border bg-card p-5 sm:p-6">
      <div className="mb-4 flex items-center gap-2.5">
        <span className={`grid h-9 w-9 place-items-center rounded-xl ${accent === "gold" ? "bg-accent/25 text-accent-foreground" : "bg-secondary text-primary"}`}><Icon d={icon} /></span>
        <h2 className="text-base font-bold">{title}</h2>
      </div>
      {items?.length ? (
        <ul className="space-y-3">
          {items.map((item, i) => (
            <li key={i} className="flex gap-3 text-xs leading-6 text-muted-foreground">
              {numbered ? <span className="grid h-6 w-6 shrink-0 place-items-center rounded-lg bg-secondary font-mono text-[10px] font-bold text-primary">{i + 1}</span> : <span className="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-accent" />}
              <span>{item}</span>
            </li>
          ))}
        </ul>
      ) : <p className="text-xs text-muted-foreground">لم تتم إضافة تفاصيل بعد.</p>}
    </section>
  );
}

function PreparationOverlay({ recipe, onClose }) {
  const [seconds, setSeconds] = useState(0);
  const [active, setActive] = useState(false);
  useEffect(() => {
    if (!active || seconds <= 0) return;
    const t = setInterval(() => setSeconds((s) => Math.max(s - 1, 0)), 1000);
    return () => clearInterval(t);
  }, [active, seconds]);
  const mm = Math.floor(seconds / 60).toString().padStart(2, "0");
  const ss = (seconds % 60).toString().padStart(2, "0");
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40 p-3 backdrop-blur-sm sm:items-center">
      <div className="w-full max-w-[420px] rounded-[28px] border border-border bg-card p-6 shadow-2xl">
        <div className="flex items-start justify-between">
          <div>
            <p className="font-mono text-[10px] font-bold tracking-[.18em] text-primary">PREP MODE</p>
            <h2 className="mt-2 text-xl font-bold">وضع التحضير</h2>
            <p className="mt-1 text-xs text-muted-foreground">{recipe.title}</p>
          </div>
          <button onClick={onClose} className="grid h-9 w-9 place-items-center rounded-xl bg-secondary text-muted-foreground"><Icon d={icons.x} /></button>
        </div>
        <div className="my-8 text-center">
          <div className="font-mono text-6xl font-bold text-primary">{mm}:{ss}</div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setSeconds(0)} className="grid h-12 w-12 place-items-center rounded-xl border border-border text-muted-foreground"><Icon d={icons.timerReset} /></button>
          <button onClick={() => { setSeconds(seconds > 0 ? seconds : 30); setActive(!active); }} className="flex h-12 flex-1 items-center justify-center gap-2 rounded-xl bg-primary text-sm font-bold text-primary-foreground">{active ? "إيقاف المؤقت" : "ابدأ المؤقت"}</button>
          <button onClick={() => setSeconds(seconds + 30)} className="h-12 rounded-xl border border-border px-3 font-mono text-xs font-bold text-primary">+30</button>
        </div>
      </div>
    </div>
  );
}

function RecipeDetailPage({ id, setView, notify }) {
  const [recipe, setRecipe] = useState(null);
  const [error, setError] = useState(false);
  const [editing, setEditing] = useState(false);
  const [preparing, setPreparing] = useState(false);

  const load = () => { setError(false); apiGet(`/recipes/${id}`).then(setRecipe).catch(() => setError(true)); };
  useEffect(load, [id]);

  if (error) return <div className="px-5 py-10"><ErrorState onRetry={load} /></div>;
  if (!recipe) return <div className="mx-auto max-w-[900px] space-y-4 px-5 py-8">{[0,1,2].map(i => <div key={i} className="h-40 rounded-2xl bg-secondary animate-pulse" />)}</div>;

  const handleFavorite = () => apiSend(`/recipes/${id}/favorite`, "POST").then(setRecipe).catch(() => notify("تعذر تحديث المفضلة", "", "destructive"));
  const handleDelete = () => {
    if (!window.confirm("هل تريد حذف هذه الوصفة نهائيًا؟")) return;
    apiSend(`/recipes/${id}`, "DELETE").then(() => { notify("تم حذف الوصفة"); setView({ name: "home" }); }).catch(() => notify("تعذر حذف الوصفة", "", "destructive"));
  };

  return (
    <div className="min-h-[100dvh] px-4 py-6 sm:px-8 sm:py-9 lg:px-10">
      <div className="mx-auto max-w-[820px] space-y-5">
        <div className="flex items-center justify-between">
          <button onClick={() => setView({ name: "home" })} className="inline-flex items-center gap-2 text-xs font-bold text-muted-foreground"><Icon d={icons.arrowRight} className="h-4 w-4" /> مكتبة الوصفات</button>
          <div className="flex items-center gap-2">
            <button onClick={() => setEditing(true)} className="grid h-10 w-10 place-items-center rounded-xl border border-border bg-card text-muted-foreground"><Icon d={icons.pencil} className="h-4 w-4" /></button>
            <button onClick={handleDelete} className="grid h-10 w-10 place-items-center rounded-xl border border-border bg-card text-muted-foreground"><Icon d={icons.trash} className="h-4 w-4" /></button>
          </div>
        </div>
        <section className="overflow-hidden rounded-[28px] border border-border bg-card">
          <div className="relative h-56 sm:h-64">
            <RecipeImage src={recipe.imageUrl} alt={recipe.title} className="h-full w-full" />
            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent px-5 pb-5 pt-16 text-white sm:px-7">
              <span className="font-mono text-[10px] font-bold tracking-[.18em] text-accent">{sectionLabel(recipe.section)}</span>
              <h1 className="mt-1 text-2xl font-bold sm:text-3xl">{recipe.title}</h1>
            </div>
            <button onClick={handleFavorite} className="absolute left-4 top-4 grid h-10 w-10 place-items-center rounded-xl bg-card/90 text-primary shadow">
              <Icon d={icons.heart} className={`h-5 w-5 ${recipe.isFavorite ? "fill-accent text-accent-foreground" : ""}`} />
            </button>
          </div>
          <div className="flex flex-wrap items-center gap-2 border-t border-border px-5 py-4 sm:px-7">
            {(recipe.meta || []).map((m) => <span key={m} className="rounded-lg bg-secondary px-3 py-1.5 text-[11px] font-semibold text-primary">{m}</span>)}
            <button onClick={() => setPreparing(true)} className="mr-auto inline-flex items-center gap-2 rounded-xl bg-primary px-3 py-2 text-[11px] font-bold text-primary-foreground"><Icon d={icons.coffee} className="h-3.5 w-3.5" /> وضع التحضير</button>
          </div>
        </section>

        <div className="grid gap-5 lg:grid-cols-2">
          <InfoSection title="المكونات" icon={icons.coffee} items={recipe.ingredients} accent="gold" />
          <InfoSection title="المعدات" icon={icons.filter} items={recipe.equipment} />
        </div>
        <InfoSection title="خطوات التحضير" icon={icons.list} items={recipe.steps} numbered />
        <div className="grid gap-5 md:grid-cols-2">
          <InfoSection title="مؤشرات الجودة" icon={icons.check} items={recipe.qc} accent="gold" />
          <InfoSection title="ملاحظات وأخطاء شائعة" icon={icons.alert} items={[...(recipe.notes || []), ...(recipe.errors || [])]} />
        </div>
      </div>
      {editing && <RecipeEditorDialog recipe={recipe} onClose={() => setEditing(false)} onSaved={(u) => { setEditing(false); setRecipe(u); notify("تم حفظ التعديلات"); }} notify={notify} />}
      {preparing && <PreparationOverlay recipe={recipe} onClose={() => setPreparing(false)} />}
    </div>
  );
}

// ---------- Editor ----------
function RecipeEditorDialog({ recipe, onClose, onSaved, notify }) {
  const [title, setTitle] = useState(recipe?.title || "");
  const [section, setSection] = useState(recipe?.section || recipeSections[0]);
  const [meta, setMeta] = useState((recipe?.meta || []).join("\n"));
  const [ingredients, setIngredients] = useState((recipe?.ingredients || []).join("\n"));
  const [equipment, setEquipment] = useState((recipe?.equipment || []).join("\n"));
  const [steps, setSteps] = useState((recipe?.steps || []).join("\n"));
  const [qc, setQc] = useState((recipe?.qc || []).join("\n"));
  const [notes, setNotes] = useState((recipe?.notes || []).join("\n"));
  const [errors, setErrors] = useState((recipe?.errors || []).join("\n"));
  const [imageUrl, setImageUrl] = useState(recipe?.imageUrl || "");
  const [saving, setSaving] = useState(false);

  const lines = (v) => v.split("\n").map((s) => s.trim()).filter(Boolean);
  const fields = [
    { label: "المكونات", value: ingredients, set: setIngredients, placeholder: "إسبريسو دبل: 50 مل" },
    { label: "المعدات", value: equipment, set: setEquipment, placeholder: "ماكينة إسبريسو" },
    { label: "الخطوات", value: steps, set: setSteps, placeholder: "اطحن البن..." },
    { label: "ملاحظات الجودة", value: qc, set: setQc, placeholder: "الطعم متزن" },
    { label: "ملاحظات إضافية", value: notes, set: setNotes, placeholder: "ملاحظة عن التقديم" },
    { label: "الأخطاء والحلول", value: errors, set: setErrors, placeholder: "طعم مر: قلل زمن الاستخلاص" },
  ];

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!title.trim()) { notify("أدخل اسم الوصفة أولًا", "", "destructive"); return; }
    const payload = {
      section: section.trim(), title: title.trim(),
      meta: lines(meta), ingredients: lines(ingredients), equipment: lines(equipment),
      steps: lines(steps), qc: lines(qc), notes: lines(notes), errors: lines(errors),
      ...(imageUrl ? { imageUrl } : {}),
    };
    setSaving(true);
    const req = recipe ? apiSend(`/recipes/${recipe.id}`, "PATCH", payload) : apiSend("/recipes", "POST", payload);
    req.then(onSaved).catch(() => { setSaving(false); notify("تعذر حفظ الوصفة", "", "destructive"); });
  };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto bg-black/40 p-3 backdrop-blur-sm sm:p-6">
      <div className="mx-auto max-w-[640px] rounded-[28px] border border-border bg-card shadow-2xl">
        <div className="sticky top-0 z-10 flex items-center justify-between rounded-t-[28px] border-b border-border bg-card/95 px-5 py-4 backdrop-blur sm:px-7">
          <h2 className="text-lg font-bold">{recipe ? "تعديل الوصفة" : "وصفة جديدة"}</h2>
          <button onClick={onClose} className="grid h-9 w-9 place-items-center rounded-xl bg-secondary text-muted-foreground"><Icon d={icons.x} /></button>
        </div>
        <form onSubmit={handleSubmit} className="space-y-5 p-5 sm:p-7">
          <div className="grid gap-4 sm:grid-cols-[1fr_.7fr]">
            <label className="block text-xs font-bold">اسم الوصفة
              <input value={title} onChange={(e) => setTitle(e.target.value)} className="mt-2 h-11 w-full rounded-xl border border-border bg-background px-3 text-sm outline-none focus:ring-4 focus:ring-primary/15" placeholder="مثال: لاتيه الفانيليا" />
            </label>
            <label className="block text-xs font-bold">القسم
              <select value={section} onChange={(e) => setSection(e.target.value)} className="mt-2 h-11 w-full rounded-xl border border-border bg-background px-3 text-xs outline-none focus:ring-4 focus:ring-primary/15">
                {[...new Set([...(recipe?.section ? [recipe.section] : []), ...recipeSections])].map((v) => <option key={v} value={v}>{sectionLabel(v)}</option>)}
              </select>
            </label>
          </div>
          <label className="block text-xs font-bold">بيانات سريعة
            <textarea value={meta} onChange={(e) => setMeta(e.target.value)} className="mt-2 min-h-16 w-full rounded-xl border border-border bg-background p-3 text-xs leading-6 outline-none focus:ring-4 focus:ring-primary/15" placeholder="25-30 مل" />
          </label>
          {fields.map((f) => (
            <label key={f.label} className="block text-xs font-bold">{f.label}
              <textarea value={f.value} onChange={(e) => f.set(e.target.value)} className="mt-2 min-h-20 w-full rounded-xl border border-border bg-background p-3 text-xs leading-7 outline-none focus:ring-4 focus:ring-primary/15" placeholder={f.placeholder} />
            </label>
          ))}
          <label className="block text-xs font-bold">رابط صورة الوصفة
            <span className="mt-2 block text-[10px] font-normal text-muted-foreground">يمكن إضافتها لاحقًا من الإعدادات عبر Cloudinary.</span>
            <input value={imageUrl} onChange={(e) => setImageUrl(e.target.value)} className="mt-2 h-11 w-full rounded-xl border border-border bg-background px-3 text-xs outline-none focus:ring-4 focus:ring-primary/15" placeholder="https://..." dir="ltr" />
          </label>
          <div className="flex flex-col-reverse gap-2 pt-2 sm:flex-row">
            <button type="button" onClick={onClose} className="h-11 rounded-xl border border-border px-5 text-xs font-bold text-muted-foreground">إلغاء</button>
            <button type="submit" disabled={saving} className="inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-primary px-5 text-xs font-bold text-primary-foreground disabled:opacity-60">
              {saving ? "جارٍ الحفظ..." : <><Icon d={icons.check} className="h-4 w-4" /> حفظ الوصفة</>}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

function NewRecipePage({ setView, notify }) {
  return (
    <div className="min-h-[100dvh] px-4 py-6 sm:px-8 sm:py-9 lg:px-10">
      <div className="mx-auto max-w-[700px]">
        <PageHeading eyebrow="NEW ENTRY" title="أضف وصفة للبار" description="اجعل خطواتك المضمونة جاهزة لكل من يعمل معك."
          action={<button onClick={() => setView({ name: "home" })} className="inline-flex items-center gap-2 text-xs font-bold text-muted-foreground"><Icon d={icons.arrowRight} className="h-4 w-4" /> رجوع</button>} />
        <div className="mt-8">
          <RecipeEditorDialog onClose={() => setView({ name: "home" })} notify={notify} onSaved={(r) => { notify("تمت إضافة الوصفة", r.title); setView({ name: "detail", id: r.id }); }} />
        </div>
      </div>
    </div>
  );
}

// ---------- Settings ----------
function SettingsPage({ notify }) {
  const [recipes, setRecipes] = useState(null);
  const [selectedId, setSelectedId] = useState("");
  const [uploading, setUploading] = useState(false);
  const [cloudinaryReady, setCloudinaryReady] = useState(null);
  const fileRef = useRef(null);

  useEffect(() => {
    apiGet("/recipes").then(setRecipes).catch(() => setRecipes([]));
    fetch(API + "/cloudinary-config").then((r) => setCloudinaryReady(r.ok)).catch(() => setCloudinaryReady(false));
  }, []);

  const selectedRecipe = recipes?.find((r) => r.id === selectedId);

  const handleUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file || !selectedRecipe) return;
    setUploading(true);
    try {
      const cfg = await apiGet("/cloudinary-config");
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", cfg.uploadPreset);
      formData.append("folder", cfg.folder);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${cfg.cloudName}/image/upload`, { method: "POST", body: formData });
      if (!res.ok) throw new Error("upload failed");
      const uploaded = await res.json();
      const updated = await apiSend(`/recipes/${selectedRecipe.id}`, "PATCH", { imageUrl: uploaded.secure_url, imagePublicId: uploaded.public_id });
      setRecipes((rs) => rs.map((r) => (r.id === updated.id ? updated : r)));
      notify("تم تحديث صورة الوصفة");
    } catch {
      notify("تعذر رفع الصورة", "تأكد من إعداد Cloudinary أولًا.", "destructive");
    } finally {
      setUploading(false);
      e.target.value = "";
    }
  };

  return (
    <div className="min-h-[100dvh] px-4 py-6 sm:px-8 sm:py-9 lg:px-10">
      <div className="mx-auto max-w-[800px] space-y-6">
        <PageHeading eyebrow="WORKSPACE SETTINGS" title="الإعدادات" description="إدارة صور الوصفات." />
        <section className="rounded-[26px] border border-border bg-card p-5 sm:p-7">
          <div className="flex items-start gap-3">
            <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-secondary text-primary"><Icon d={icons.upload} /></span>
            <div><h2 className="font-bold">صور الوصفات</h2><p className="mt-1 text-xs leading-6 text-muted-foreground">اختر وصفة ثم ارفع صورة حقيقية من البار.</p></div>
          </div>
          {cloudinaryReady === false && (
            <div className="mt-5 flex gap-3 rounded-2xl border border-accent/50 bg-accent/15 p-4 text-xs leading-6 text-accent-foreground">
              <Icon d={icons.alert} className="mt-0.5 h-4 w-4 shrink-0" />
              <p><strong>Cloudinary غير مُعد بعد.</strong> أضف CLOUDINARY_CLOUD_NAME و CLOUDINARY_UPLOAD_PRESET (unsigned) كمتغيرات بيئة على السيرفر.</p>
            </div>
          )}
          <div className="mt-6 grid gap-4 sm:grid-cols-[1fr_auto] sm:items-end">
            <label className="block text-xs font-bold">الوصفة
              <select value={selectedId} onChange={(e) => setSelectedId(e.target.value)} className="mt-2 h-12 w-full rounded-xl border border-border bg-background px-3 text-xs outline-none focus:ring-4 focus:ring-primary/15">
                <option value="">{recipes === null ? "جارٍ التحميل..." : "اختر وصفة"}</option>
                {recipes?.map((r) => <option key={r.id} value={r.id}>{r.title}</option>)}
              </select>
            </label>
            <button disabled={!selectedRecipe || uploading || cloudinaryReady === false} onClick={() => fileRef.current?.click()} className="inline-flex h-12 items-center justify-center gap-2 rounded-xl bg-primary px-5 text-xs font-bold text-primary-foreground disabled:opacity-45">
              <Icon d={icons.upload} className="h-4 w-4" />{uploading ? "جارٍ الرفع..." : selectedRecipe?.imageUrl ? "استبدال الصورة" : "رفع صورة"}
            </button>
            <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={handleUpload} />
          </div>
          {selectedRecipe && (
            <div className="mt-6 flex items-center gap-4 rounded-2xl border border-border bg-background p-3">
              <RecipeImage src={selectedRecipe.imageUrl} alt={selectedRecipe.title} className="h-16 w-16 rounded-xl" />
              <div className="min-w-0"><p className="truncate text-sm font-bold">{selectedRecipe.title}</p><p className="mt-1 truncate text-[10px] text-muted-foreground">{selectedRecipe.imageUrl ? "صورة مضافة" : "لا توجد صورة بعد"}</p></div>
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

// ---------- App ----------
function App() {
  const [view, setView] = useState({ name: "home" });
  const { notify, ToastHost } = useToast();

  let page;
  if (view.name === "home") page = <LibraryPage setView={setView} notify={notify} />;
  else if (view.name === "detail") page = <RecipeDetailPage id={view.id} setView={setView} notify={notify} />;
  else if (view.name === "new") page = <NewRecipePage setView={setView} notify={notify} />;
  else if (view.name === "settings") page = <SettingsPage notify={notify} />;
  else page = <LibraryPage setView={setView} notify={notify} />;

  return (
    <Shell view={view} setView={setView}>
      {page}
      <ToastHost />
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
