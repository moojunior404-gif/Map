const codeToFlag = (code) =>
  code.toUpperCase().replace(/./g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0)));

const COUNTRIES = RAW.map(([code, name, lat, lng, ...alts]) => ({
  code, name, lat, lng, alts, flag: codeToFlag(code),
}));

const normalize = (s) =>
  (s || "")
    .trim()
    .replace(/[إأآا]/g, "ا")
    .replace(/ة/g, "ه")
    .replace(/ى/g, "ي")
    .replace(/\s+/g, " ")
    .replace(/^ال/, "")
    .toLowerCase();

const isCorrectAnswer = (input, country) => {
  const n = normalize(input);
  if (!n) return false;
  const candidates = [country.name, ...country.alts];
  return candidates.some((c) => normalize(c) === n);
};

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const pick = (n, exclude) => {
  const pool = COUNTRIES.filter((c) => c.code !== exclude);
  return shuffle(pool).slice(0, n);
};

/* ---------------- sound ---------------- */
function useBeep() {
  const ctxRef = useRef(null);
  const [on, setOn] = useState(true);
  const beep = useCallback(
    (kind) => {
      if (!on) return;
      try {
        if (!ctxRef.current) {
          const AC = window.AudioContext || window.webkitAudioContext;
          ctxRef.current = new AC();
        }
        const ctx = ctxRef.current;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        if (kind === "ok") {
          o.type = "sine";
          o.frequency.setValueAtTime(660, ctx.currentTime);
          o.frequency.setValueAtTime(880, ctx.currentTime + 0.09);
        } else {
          o.type = "square";
          o.frequency.setValueAtTime(180, ctx.currentTime);
        }
        g.gain.setValueAtTime(0.07, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        o.start();
        o.stop(ctx.currentTime + 0.28);
      } catch (e) {
        /* audio not available, fail silently */
      }
    },
    [on]
  );
  return { on, setOn, beep };
}

/* ---------------- shared round-state hook ---------------- */
function useRound(roundLen, beep) {
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [history, setHistory] = useState([]);
  const [mistakes, setMistakes] = useState([]);

  const record = useCallback(
    (ok, country) => {
      beep(ok ? "ok" : "bad");
      setHistory((h) => [...h, ok]);
      setStreak((s) => (ok ? s + 1 : 0));
      if (ok) setScore((s) => s + 1);
      else setMistakes((m) => [...m, country]);
    },
    [beep]
  );

  return { idx, setIdx, score, streak, history, mistakes, record };
}

/* ---------------- Stage 1: Name + Flag ---------------- */

function Stage1MultipleChoice({ onFinish, roundLen, beep, soundOn, onToggleSound }) {
  const { idx, setIdx, score, streak, history, mistakes, record } = useRound(roundLen, beep);
  const [country] = useState(() => shuffle(COUNTRIES).slice(0, roundLen));
  const [options, setOptions] = useState(() => buildOptions(country[0]));
  const [chosen, setChosen] = useState(null);
  const [stamp, setStamp] = useState(null);

  function buildOptions(c) {
    return shuffle([c, ...pick(3, c.code)]);
  }

  const current = country[idx];

  const handlePick = useCallback(
    (opt) => {
      if (chosen) return;
      const ok = opt.code === current.code;
      setChosen(opt.code);
      setStamp(ok ? "ok" : "bad");
      record(ok, current);
      setTimeout(() => {
        setStamp(null);
        setChosen(null);
        if (idx + 1 < roundLen) {
          setIdx((i) => i + 1);
          setOptions(buildOptions(country[idx + 1]));
        } else {
          onFinish(score + (ok ? 1 : 0), [...mistakes, ...(ok ? [] : [current])]);
        }
      }, 750);
    },
    [chosen, current, idx, roundLen, score, mistakes, record, onFinish, country]
  );

  useEffect(() => {
    const onKey = (e) => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= options.length) handlePick(options[n - 1]);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [options, handlePick]);

  return (
    <div className="relative">
      <Stamp ok={stamp === "ok"} show={!!stamp} />
      <TopBar onHome={() => onFinish(null)} history={history} total={roundLen} score={score} streak={streak} soundOn={soundOn} onToggleSound={onToggleSound} />
      <div className="flex flex-col items-center gap-8">
        <div className="text-8xl drop-shadow-lg select-none">{current.flag}</div>
        <p className="text-[#1E2233]/60 text-sm" style={{ fontFamily: FONT }}>
          دي علم أنهي دولة؟
        </p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-md">
          {options.map((opt, i) => {
            const isChosen = chosen === opt.code;
            const isRight = chosen && opt.code === current.code;
            return (
              <button
                key={opt.code}
                onClick={() => handlePick(opt)}
                disabled={!!chosen}
                className={`relative rounded-xl px-5 py-4 text-lg font-bold border-2 transition-all text-right focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#A9861E]
                  ${
                    isRight
                      ? "bg-emerald-500/20 border-emerald-400 text-emerald-300"
                      : isChosen
                      ? "bg-rose-500/20 border-rose-500 text-rose-300"

                >
                  {i + 1}
                </span>
                {opt.name}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Stage1Typing({ onFinish, roundLen, beep, soundOn, onToggleSound }) {
  const { idx, setIdx, score, streak, history, mistakes, record } = useRound(roundLen, beep);

  const [value, setValue] = useState("");
  const [stamp, setStamp] = useState(null);

  const current = country[idx];

  const submit = () => {
    if (reveal) return;
    const ok = isCorrectAnswer(value, current);
    setStamp(ok ? "ok" : "bad");
    setReveal(true);
    record(ok, current);
    setTimeout(() => {
      setStamp(null);
      setReveal(false);
      setValue("");

  return (

            تأكيد
          </button>
        </div>
      </div>

}

/* ---------------- Stage 2: Name + Flag + Location ---------------- */

function Stage2MultipleChoice({ onFinish, roundLen, beep, soundOn, onToggleSound }) {
  const { idx, setIdx, score, streak, history, mistakes, record } = useRound(roundLen, beep);
  const [country] = useState(() => shuffle(COUNTRIES).slice(0, roundLen));
  const [dots, setDots] = useState(() => buildDots(country[0]));
  const [chosen, setChosen] = useState(null);
  const [stamp, setStamp] = useState(null);

  function buildDots(c) {
    return shuffle([c, ...pick(4, c.code)]);
  }

  const current = country[idx];

  const handlePick = useCallback(
    (opt) => {
      if (chosen) return;
      const ok = opt.code === current.code;
      setChosen(opt.code);
      setStamp(ok ? "ok" : "bad");
      record(ok, current);
      setTimeout(() => {
        setStamp(null);
        setChosen(null);
        if (idx + 1 < roundLen) {
          setIdx((i) => i + 1);
          setDots(buildDots(country[idx + 1]));
        } else {
          onFinish(score + (ok ? 1 : 0), [...mistakes, ...(ok ? [] : [current])]);
        }
      }, 850);
    },
    [chosen, current, idx, roundLen, score, mistakes, record, onFinish, country]
  );

  useEffect(() => {
    const onKey = (e) => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= dots.length) handlePick(dots[n - 1]);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [dots, handlePick]);

  return (
    <div className="relative">
      <Stamp ok={stamp === "ok"} show={!!stamp} />
      <TopBar onHome={() => onFinish(null)} history={history} total={roundLen} score={score} streak={streak} soundOn={soundOn} onToggleSound={onToggleSound} />
      <div className="flex flex-col items-center gap-4">
        <div className="flex items-center gap-3">
          <span className="text-5xl">{current.flag}</span>
          <span className="text-2xl font-bold text-[#1E2233]" style={{ fontFamily: FONT }}>
            {current.name}
          </span>
        </div>
        <p className="text-[#1E2233]/60 text-sm" style={{ fontFamily: FONT }}>
          دوس على مكانها على الخريطة
        </p>
        <div className="relative w-full max-w-2xl rounded-xl overflow-hidden border border-black/10" style={{ backgroundColor: C.panel }}>
          <img src={WORLD_MAP_IMG} alt="" className="w-full h-auto opacity-80 select-none" draggable={false} />
          {dots.map((d, i) => {
            const { x, y } = toXY(d.lat, d.lng);
            const isChosen = chosen === d.code;
            const isRight = chosen && d.code === current.code;
            return (
              <button
                key={d.code}
                onClick={() => handlePick(d)}
                disabled={!!chosen}
                aria-label={`خيار ${i + 1}`}
                style={{ left: `${x}%`, top: `${y}%` }}
                className={`absolute -translate-x-1/2 -translate-y-1/2 w-6 h-6 rounded-full border-2 flex items-center justify-center text-[10px] font-bold transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white
                  ${
                    isRight
                      ? "bg-emerald-400 border-emerald-100 text-emerald-900 scale-150 z-10"
                      : isChosen
                      ? "bg-rose-500 border-rose-100 text-rose-950 scale-150 z-10"
                      : "border-white/70 hover:scale-125 text-[#12141C]"
                  }`}
              >
                <span style={{ backgroundColor: isChosen || isRight ? "transparent" : C.brass, position: "absolute", inset: 0, borderRadius: "9999px", zIndex: -1 }} />
                {i + 1}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Result screen ---------------- */

  const pct = Math.round((score / roundLen) * 100);

    pct >= 90 ? "سفير فخري! 🌍" : pct >= 70 ? "ممتاز جدًا!" : pct >= 40 ? "مش بطال، كمّل تدرب" : "ابدأ من الأول وهتتحسن";
  return (
    <div className="flex flex-col items-center gap-6 py-6" dir="rtl">
      <div
        className="rounded-full border-[6px] w-40 h-40 flex flex-col items-center justify-center rotate-[-6deg]"
        style={{ borderColor: C.brass, fontFamily: FONT }}
      >
        <span className="text-4xl font-black" style={{ color: C.brass }}>
          {score}/{roundLen}
        </span>
        <span className="text-xs" style={{ color: C.brass + "cc" }}>

        </span>
      </div>

        {msg}

      {mistakes.length > 0 && (
        <div className="w-full max-w-md">

            {mistakes.map((m, i) => (
              <span
                key={m.code + i}

          <RotateCcw size={18} /> إعادة المحاولة

        <button
          onClick={onHome}
          className="flex items-center gap-2 rounded-xl bg-black/5 text-[#1E2233] font-bold px-5 py-3 hover:bg-black/10"

/* ---------------- Root ---------------- */

function App() {
  const [mode, setMode] = useState("home");
  const [lastScore, setLastScore] = useState(0);
  const [lastMistakes, setLastMistakes] = useState([]);
  const [lastMode, setLastMode] = useState("s1mc");
  const [roundLen, setRoundLen] = useState(10);
  const [bests, setBests] = useState({ s1mc: null, s1type: null, s2mc: null, s2type: null });
  const { on: soundOn, setOn: setSoundOn, beep } = useBeep();

  const finish = useCallback(
    (score, mistakes) => {
      if (score === null) {
        setMode("home");
        return;
      }
      setLastScore(score);
      setLastMistakes(mistakes || []);
      setBests((b) => ({ ...b, [lastMode]: b[lastMode] == null ? score : Math.max(b[lastMode], score) }));
      setMode("result");
    },
    [lastMode]
  );

  const start = (m) => {
    setLastMode(m);
    setMode(m);
  };

  const stageProps = { onFinish: finish, roundLen, beep, soundOn, onToggleSound: () => setSoundOn((s) => !s) };

  return (
    <div className="min-h-screen w-full flex items-center justify-center p-4" style={{ backgroundColor: C.bg }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap');
        @keyframes stampIn {
          0% { opacity: 0; transform: scale(2) rotate(-8deg); }
          60% { opacity: 1; transform: scale(0.95) rotate(-8deg); }
          100% { opacity: 1; transform: scale(1) rotate(-8deg); }
        }
        @media (prefers-reduced-motion: reduce) {
          * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
        }
      `}</style>
      <div className="w-full max-w-2xl rounded-3xl p-6 sm:p-8 border border-black/5 shadow-sm" style={{ backgroundColor: C.surface }}>
        {mode === "home" && <Home_ onStart={start} roundLen={roundLen} setRoundLen={setRoundLen} bests={bests} />}
        {mode === "s1mc" && <Stage1MultipleChoice {...stageProps} />}
        {mode === "s1type" && <Stage1Typing {...stageProps} />}
        {mode === "s2mc" && <Stage2MultipleChoice {...stageProps} />}
        {mode === "s2type" && <Stage2Typing {...stageProps} />}
        {mode === "result" && (
          <ResultScreen score={lastScore} roundLen={roundLen} mistakes={lastMistakes} onHome={() => setMode("home")} onRetry={() => setMode(lastMode)} />
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
