<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إضافة منيو الفطاير الكامل — مرة واحدة بس</title>
<style>
  body{font-family:sans-serif;max-width:480px;margin:40px auto;padding:0 16px;line-height:1.7}
  button{padding:14px 20px;font-size:15px;border:none;border-radius:10px;background:#1f7a4d;color:#fff;cursor:pointer;width:100%;margin-top:10px}
  input{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:14px;box-sizing:border-box}
  #log{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;margin-top:16px;font-size:13px;max-height:400px;overflow:auto}
</style>
</head>
<body>
  <h2>إضافة منيو الفطاير الكامل (مرة واحدة)</h2>
  <p>
    الصفحة دي بتدور على قسم "الفطير المشلتت" (اللي بيفتح صورة دلوقتي)، وبتحوّله لقسم أصناف عادي فيه 5 أقسام فرعية،
    وبتضيف الـ 35 صنف فطيرة اللي بعتهملك جوا الأقسام دي. تشغلها مرة واحدة بس.
  </p>
  <label>الإيميل</label><input id="email" type="email" placeholder="admin@example.com"/>
  <label>الباسورد</label><input id="password" type="password"/>
  <button id="runBtn">سجل دخول وابدأ</button>
  <div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// نفس إعدادات firebase-app.js بالظبط
const firebaseConfig = {
  apiKey: "AIzaSyCde_rpDGJI8HIr03a1eKaRzPFPo3mrRjI",
  authDomain: "anwarlebanonbakery-5815b.firebaseapp.com",
  projectId: "anwarlebanonbakery-5815b",
  storageBucket: "anwarlebanonbakery-5815b.firebasestorage.app",
  messagingSenderId: "301016473650",
  appId: "1:301016473650:web:1fc3fb5ced7b446cd19c2b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const logEl = document.getElementById('log');
const log = (msg) => { logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; };

const IMG_BASE = "https://raw.githubusercontent.com/anwarlebanonbakery/bakery-images/main/";
const img = (name) => IMG_BASE + name;

// ── الأقسام الفرعية الخمسة ──
const SECTIONS = [
  { id: 'sada',   name: 'الفطاير السادة والحلوة' },
  { id: 'ajban',  name: 'فطاير الأجبان' },
  { id: 'lohoum', name: 'فطاير اللحوم' },
  { id: 'dajaj',  name: 'فطاير الدجاج' },
  { id: 'asmak',  name: 'فطاير الأسماك' },
];

// ── الـ 35 صنف، كل واحد بقسمه الفرعي وسعر الوسط والكبير ──
const ITEMS = [
  // 🥐 الفطاير السادة والحلوة
  { sec: 'sada', name: 'فطير سادة',              img: 'IMG-20260829-WA0032.jpg', mid: 25, big: 40 },
  { sec: 'sada', name: 'فطير لوتس',               img: 'IMG-20260829-WA0038.jpg', mid: 25, big: 50 },
  { sec: 'sada', name: 'فطير لوتس + موز',          img: 'IMG-20260829-WA0044.jpg', mid: 30, big: 60 },
  { sec: 'sada', name: 'فطير لوتس + مكسرات',       img: 'IMG-20260829-WA0067.jpg', mid: 30, big: 60 },
  { sec: 'sada', name: 'فطير مربى',               img: 'IMG-20260829-WA0066.jpg', mid: 20, big: 40 },
  { sec: 'sada', name: 'فطير مربى + قشطة',         img: 'IMG-20260829-WA0064.jpg', mid: 25, big: 50 },
  // 🧀 فطاير الأجبان
  { sec: 'ajban', name: 'فطير جبنة فيتا',          img: 'IMG-20260829-WA0049.jpg', mid: 20, big: 40 },
  { sec: 'ajban', name: 'فطير جبنة رومي',          img: 'IMG-20260829-WA0039.jpg', mid: 25, big: 45 },
  { sec: 'ajban', name: 'فطير جبنة كرافت',         img: 'IMG-20260829-WA0060.jpg', mid: 17.5, big: 35 },
  { sec: 'ajban', name: 'فطير جبنة + زيتون',       img: 'IMG-20260829-WA0031.jpg', mid: 20, big: 40 },
  { sec: 'ajban', name: 'فطير جبنة + فلفل',        img: 'IMG-20260829-WA0046.jpg', mid: 25, big: 40 },
  { sec: 'ajban', name: 'فطير جبنة + مشروم',       img: 'IMG-20260829-WA0055.jpg', mid: 25, big: 40 },
  { sec: 'ajban', name: 'فطير زعتر + جبنة',        img: 'IMG-20260829-WA0061.jpg', mid: 20, big: 40 },
  { sec: 'ajban', name: 'فطير مكس أجبان',          img: 'IMG-20260829-WA0054.jpg', mid: 25, big: 50 },
  { sec: 'ajban', name: 'فطير لبنة + فلافل',       img: 'IMG-20260829-WA0040.jpg', mid: 25, big: 40 },
  // 🥩 فطاير اللحوم
  { sec: 'lohoum', name: 'فطير لحمة مفرومة',        img: 'IMG-20260829-WA0041.jpg', mid: 25, big: 40 },
  { sec: 'lohoum', name: 'فطير لحمة + جبنة',        img: 'IMG-20260829-WA0050.jpg', mid: 30, big: 50 },
  { sec: 'lohoum', name: 'فطير لحم + فلفل + بصل',   img: 'IMG-20260829-WA0057.jpg', mid: 30, big: 55 },
  { sec: 'lohoum', name: 'فطير شاورما لحم',         img: 'IMG-20260829-WA0063.jpg', mid: 30, big: 55 },
  { sec: 'lohoum', name: 'فطير شاورما لحم + جبنة',  img: 'IMG-20260829-WA0034.jpg', mid: 30, big: 55 },
  { sec: 'lohoum', name: 'فطير بسطرمة + جبنة',      img: 'IMG-20260829-WA0035.jpg', mid: 25, big: 50 },
  { sec: 'lohoum', name: 'فطير سجق',                img: 'IMG-20260829-WA0047.jpg', mid: 25, big: 40 },
  { sec: 'lohoum', name: 'فطير سجق + جبنة',         img: 'IMG-20260829-WA0056.jpg', mid: 25, big: 50 },
  { sec: 'lohoum', name: 'فطير نقانق + جبنة',       img: 'IMG-20260829-WA0062.jpg', mid: 25, big: 50 },
  { sec: 'lohoum', name: 'فطير مكس لحوم',           img: 'IMG-20260829-WA0065.jpg', mid: 35, big: 60 },
  { sec: 'lohoum', name: 'فطير أجبان ولحوم (مكس)',  img: 'IMG-20260829-WA0043.jpg', mid: 35, big: 60 },
  // 🍗 فطاير الدجاج
  { sec: 'dajaj', name: 'فطير دجاج',                img: 'IMG-20260829-WA0042.jpg', mid: 35, big: 55 },
  { sec: 'dajaj', name: 'فطير دجاج + جبنة',         img: 'IMG-20260829-WA0051.jpg', mid: 35, big: 55 },
  { sec: 'dajaj', name: 'فطير شاورما دجاج',         img: 'IMG-20260829-WA0058.jpg', mid: 30, big: 50 },
  { sec: 'dajaj', name: 'فطير شاورما دجاج + جبنة',  img: 'IMG-20260829-WA0068.jpg', mid: 25, big: 50 },
  { sec: 'dajaj', name: 'فطير دجاج + مشروم + جبنة', img: 'IMG-20260829-WA0036.jpg', mid: 35, big: 55 },
  { sec: 'dajaj', name: 'فطير مكس فراخ ولحوم',      img: 'IMG-20260829-WA0037.jpg', mid: 35, big: 60 },
  // 🐟 فطاير الأسماك
  { sec: 'asmak', name: 'فطير تونة',                img: 'IMG-20260829-WA0045.jpg', mid: 30, big: 55 },
  { sec: 'asmak', name: 'فطير تونة + جبنة',         img: 'IMG-20260829-WA0053.jpg', mid: 35, big: 60 },
  { sec: 'asmak', name: 'فطير تونة + زيتون',        img: 'IMG-20260829-WA0059.jpg', mid: 35, big: 60 },
];

document.getElementById('runBtn').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    log("✅ تم تسجيل الدخول");
  } catch (e) {
    log("❌ فشل تسجيل الدخول: " + e.message);
    return;
  }

  // ── دور على قسم "الفطير المشلتت" ──
  log("🔎 بدور على قسم الفطير المشلتت...");
  const catsSnap = await getDocs(collection(db, "categories"));
  let mashaltetDoc = null;
  catsSnap.forEach(d => {
    const data = d.data();
    if ((data.name || '').includes('مشلتت')) mashaltetDoc = { id: d.id, ...data };
  });

  if (!mashaltetDoc) {
    log("❌ مالقتش قسم اسمه فيه 'مشلتت'. افتحي لوحة الأدمن وشوفي اسم القسم بالظبط، وابعتيهولي لو مختلف.");
    return;
  }
  log(`✅ لقيت القسم: "${mashaltetDoc.name}" (${mashaltetDoc.id})`);

  // ── تحقق إننا مش هنكرر الإضافة لو الصفحة اتشغلت قبل كده ──
  const existingProdsSnap = await getDocs(query(collection(db, "products"), where("categoryId", "==", mashaltetDoc.id)));
  if (existingProdsSnap.size > 0) {
    log(`⚠️ القسم ده فيه بالفعل ${existingProdsSnap.size} صنف. لو كملتي هيتضاف الـ 35 صنف فوقهم (ممكن يبقوا مكررين).`);
    if (!confirm(`القسم فيه ${existingProdsSnap.size} صنف بالفعل. متأكد عايز تكمل وتضيف الـ 35 صنف الجداد؟`)) {
      log("⏹ اتوقف بناءً على طلبك.");
      return;
    }
  }

  // ── حوّل القسم من نوع "صورة" لنوع "قسم أصناف" وضيف الأقسام الفرعية ──
  await updateDoc(doc(db, "categories", mashaltetDoc.id), {
    displayType: 'category',
    menuImageUrl: '',
    sections: SECTIONS,
    updatedAt: serverTimestamp(),
  });
  log("✅ اتحول القسم لقسم أصناف عادي وانضافله 5 أقسام فرعية");

  // ── ضيف الأصناف الـ 35 ──
  let order = existingProdsSnap.size;
  for (const it of ITEMS) {
    await addDoc(collection(db, "products"), {
      name: it.name,
      categoryId: mashaltetDoc.id,
      sectionId: it.sec,
      imageUrl: img(it.img),
      sizePrices: [
        { name: 'وسط', price: it.mid },
        { name: 'كبير', price: it.big },
      ],
      price: null,
      description: '',
      flavors: [],
      sizes: [],
      manaeshTypes: [],
      wide: false,
      tall: false,
      displayOrder: order++,
      visible: true,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
    log(`✅ ${it.name}`);
  }

  log(`🎉 خلصنا! اتضاف ${ITEMS.length} صنف فطيرة في 5 أقسام فرعية. افتحي الموقع وجربي.`);
};
</script>
</body>
</html>
