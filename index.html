<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إضافة صور الشوكولاتة — مرة واحدة بس</title>
<style>
  body{font-family:sans-serif;max-width:480px;margin:40px auto;padding:0 16px;line-height:1.7}
  button{padding:14px 20px;font-size:15px;border:none;border-radius:10px;background:#1f7a4d;color:#fff;cursor:pointer;width:100%;margin-top:10px}
  input{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:14px;box-sizing:border-box}
  #log{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;margin-top:16px;font-size:13px;max-height:400px;overflow:auto}
</style>
</head>
<body>
  <h2>إضافة صور الشوكولاتة (مرة واحدة)</h2>
  <p>
    الصفحة دي بتدور على قسم "شوكولاتة"، وبتضيف الـ 14 صورة اللي رفعتيهم على مستودع bakery-images
    كأصناف "صورة بس" (من غير اسم أو سعر ظاهر للعميل). تشغلها مرة واحدة بس.
  </p>
  <label>الإيميل</label><input id="email" type="email" placeholder="admin@example.com"/>
  <label>الباسورد</label><input id="password" type="password"/>
  <button id="runBtn">سجل دخول وابدأ</button>
  <div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// نفس إعدادات firebase-app.js بالظبط
const firebaseConfig = {
  apiKey: "AIzaSyCde_rpDGJI8HIr03a1eKaRzPFPo3mrRjI",
  authDomain: "anwarlebanonbakery-5815b.firebaseapp.com",
  projectId: "anwarlebanonbakery-5815b",
  storageBucket: "anwarlebanonbakery-5815b.firebasestorage.app",
  messagingSenderId: "301016473650",
  appId: "1:301016473650:web:1fc3fb5ced7b446cd19c2b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const logEl = document.getElementById('log');
const log = (msg) => { logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; };

// نفس مستودع صور البيتزا بالظبط — عدّلي الاسم هنا لو مختلف
const IMG_BASE = "https://raw.githubusercontent.com/anwarlebanonbakery/bakery-images/main/";
const img = (name) => IMG_BASE + name;

// ── الـ 14 صورة، بأسمائها زي ما هي على المستودع ──
const FILES = [
  'file_00000000e1fc82108b3b602b20316989.png',
  'file_00000000de1882438025f95ade6ab080.png',
  'file_00000000586881f49f87eb7a52863bf8.png',
  'file_00000000f72482468a97776e38136dfd.png',
  'file_000000008d1c81f49edf47dd4f07f42d.png',
  'file_000000008d1c81f49edf47dd4f07f42d.png', // مكررة مرتين في القايمة اللي بعتيها — امسحي السطر ده لو مش مقصودة
  'file_00000000e6f481f486268f050a552de5.png',
  'file_0000000047c48210a121dd70796999d4.png',
  'file_00000000c83c81f4a2ff52081515b333.png',
  'file_00000000f22c81f4a28ec929864c8421.png',
  'file_000000006d1c821090608c1af3db8bd8.png',
  'file_00000000d3b081f48e51f0157b0f1265.png',
  'file_00000000d9f081f484337f7acdb1a6b1.png',
  'file_00000000a4b0824382c8d3069c5f9b35.png',
];

document.getElementById('runBtn').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    log("✅ تم تسجيل الدخول");
  } catch (e) {
    log("❌ فشل تسجيل الدخول: " + e.message);
    return;
  }

  // ── دور على قسم "شوكولاتة" ──
  log("🔎 بدور على قسم الشوكولاتة...");
  const catsSnap = await getDocs(collection(db, "categories"));
  let chocDoc = null;
  catsSnap.forEach(d => {
    const data = d.data();
    if ((data.name || '').includes('شوكولاتة')) chocDoc = { id: d.id, ...data };
  });

  if (!chocDoc) {
    log("❌ مالقتش قسم اسمه فيه 'شوكولاتة'. افتحي لوحة الأدمن وشوفي اسم القسم بالظبط، وابعتيهولي لو مختلف.");
    return;
  }
  log(`✅ لقيت القسم: "${chocDoc.name}" (${chocDoc.id})`);

  const existingProdsSnap = await getDocs(query(collection(db, "products"), where("categoryId", "==", chocDoc.id)));
  let order = existingProdsSnap.size;
  if (order > 0) {
    log(`⚠️ القسم ده فيه بالفعل ${order} صنف. لو كملتي هيتضاف الـ ${FILES.length} صورة فوقهم (ممكن يبقوا مكررين لو شغلتي الصفحة قبل كده).`);
    if (!confirm(`القسم فيه ${order} صنف بالفعل. متأكد عايز تكمل؟`)) {
      log("⏹ اتوقف بناءً على طلبك.");
      return;
    }
  }

  // ── ضيف الصور كأصناف "صورة بس" ──
  for (const filename of FILES) {
    await addDoc(collection(db, "products"), {
      name: `شوكولاتة ${order + 1}`, // للتعرف عليه في لوحة التحكم بس — مش هيظهر للعميل
      categoryId: chocDoc.id,
      sectionId: null,
      imageUrl: img(filename),
      price: null,
      sizePrices: [],
      description: '',
      flavors: [],
      sizes: [],
      manaeshTypes: [],
      wide: false,
      tall: false,
      hideInfo: true,
      displayOrder: order++,
      visible: true,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
    log(`✅ اتضافت (${filename})`);
  }

  log(`🎉 خلصنا! اتضاف ${FILES.length} صورة في قسم "${chocDoc.name}". افتحي الموقع وجربي.`);
};
</script>
</body>
</html>
