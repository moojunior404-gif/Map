<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تجهيز قسم حلويات غربية (معرض صور) — مرة واحدة بس</title>
<style>
  body{font-family:sans-serif;max-width:480px;margin:40px auto;padding:0 16px;line-height:1.7}
  button{padding:14px 20px;font-size:15px;border:none;border-radius:10px;background:#1f7a4d;color:#fff;cursor:pointer;width:100%;margin-top:10px}
  input{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:14px;box-sizing:border-box}
  #log{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;margin-top:16px;font-size:13px;max-height:400px;overflow:auto}
</style>
</head>
<body>
  <h2>تجهيز قسم "حلويات غربية" (معرض صور)</h2>
  <p>
    الصفحة دي بتدور على قسم اسمه فيه "حلويات غربية". لو لقته، بتمسح أي أصناف قديمة فيه، وبتحوّله
    لوضع "معرض صور" (صور طولية بس، من غير اسم أو سعر). لو مالقتوش، بتعمله جديد. تشغلها مرة واحدة بس.
  </p>
  <label>الإيميل</label><input id="email" type="email" placeholder="admin@example.com"/>
  <label>الباسورد</label><input id="password" type="password"/>
  <button id="runBtn">سجل دخول وابدأ</button>
  <div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, getDocs, doc, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// نفس إعدادات firebase-app.js بالظبط
const firebaseConfig = {
  apiKey: "AIzaSyCde_rpDGJI8HIr03a1eKaRzPFPo3mrRjI",
  authDomain: "anwarlebanonbakery-5815b.firebaseapp.com",
  projectId: "anwarlebanonbakery-5815b",
  storageBucket: "anwarlebanonbakery-5815b.firebasestorage.app",
  messagingSenderId: "301016473650",
  appId: "1:301016473650:web:1fc3fb5ced7b446cd19c2b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const logEl = document.getElementById('log');
const log = (msg) => { logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; };

// نفس مستودع صور البيتزا والشوكولاتة بالظبط — عدّلي الاسم هنا لو مختلف
const IMG_BASE = "https://raw.githubusercontent.com/anwarlebanonbakery/bakery-images/main/";
const img = (name) => IMG_BASE + name;

/* ══════════════════════════════════════
   حطي هنا أسماء الصور اللي رفعتيها على المستودع
   (بالترتيب اللي عايزة الصور تتعرض بيه في المعرض)
══════════════════════════════════════ */
const FILES = [
  'IMG-20260830-WA0015.jpg',
  'IMG-20260830-WA0016.jpg',
  'IMG-20260830-WA0017.jpg',
  'IMG-20260830-WA0018.jpg',
  'IMG-20260830-WA0019.jpg',
  'IMG-20260830-WA0043.jpg',
  'IMG-20260830-WA0044.jpg',
  'IMG-20260830-WA0045.jpg',
  'IMG-20260830-WA0046.jpg',
  'IMG-20260830-WA0047.jpg',
  'IMG-20260830-WA0048.jpg',
  'IMG-20260830-WA0049.jpg',
  'IMG-20260830-WA0050.jpg',
];

const CATEGORY_NAME = 'حلويات غربية';

document.getElementById('runBtn').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  if (!FILES.length) { log("⚠️ لسه محطتش أسماء الصور في مصفوفة FILES جوا الكود — ابعتيهملي وأضيفهملك."); return; }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    log("✅ تم تسجيل الدخول");
  } catch (e) {
    log("❌ فشل تسجيل الدخول: " + e.message);
    return;
  }

  log(`🔎 بدور على قسم "${CATEGORY_NAME}"...`);
  const catsSnap = await getDocs(collection(db, "categories"));
  let catDoc = null;
  catsSnap.forEach(d => {
    const data = d.data();
    if ((data.name || '').includes('حلويات غربية')) catDoc = { id: d.id, ...data };
  });

  const galleryImages = FILES.map(img);

  if (catDoc) {
    log(`✅ لقيت القسم: "${catDoc.name}" (${catDoc.id})`);

    // ── امسح أي أصناف (منتجات) قديمة تابعة للقسم ده ──
    const oldProdsSnap = await getDocs(query(collection(db, "products"), where("categoryId", "==", catDoc.id)));
    if (oldProdsSnap.size > 0) {
      if (!confirm(`القسم فيه ${oldProdsSnap.size} صنف قديم. متأكد عايز تمسحهم كلهم؟`)) {
        log("⏹ اتوقف بناءً على طلبك.");
        return;
      }
      for (const d of oldProdsSnap.docs) await deleteDoc(doc(db, "products", d.id));
      log(`🗑 اتمسح ${oldProdsSnap.size} صنف قديم`);
    }

    // ── حوّل القسم لوضع "معرض صور" ──
    await updateDoc(doc(db, "categories", catDoc.id), {
      displayType: 'gallery',
      galleryImages,
      imageUrl: galleryImages[0] || catDoc.imageUrl,
      sections: [],
      updatedAt: serverTimestamp(),
    });
    log(`✅ اتحول القسم لوضع "معرض صور" فيه ${galleryImages.length} صورة`);
  } else {
    log(`ℹ️ مالقتش قسم اسمه فيه "${CATEGORY_NAME}" — هعمله جديد.`);
    await addDoc(collection(db, "categories"), {
      name: CATEGORY_NAME,
      displayType: 'gallery',
      galleryImages,
      imageUrl: galleryImages[0] || '',
      menuImageUrl: '',
      sections: [],
      tag: '',
      emoji: '',
      visible: true,
      displayOrder: 999,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
    log(`✅ اتعمل قسم جديد "${CATEGORY_NAME}" في وضع "معرض صور" فيه ${galleryImages.length} صورة`);
  }

  log("🎉 خلصنا! افتحي الموقع وجربي.");
};
</script>
</body>
</html>
