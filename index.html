<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إضافة منيو البيتزا الكامل — مرة واحدة بس</title>
<style>
  body{font-family:sans-serif;max-width:480px;margin:40px auto;padding:0 16px;line-height:1.7}
  button{padding:14px 20px;font-size:15px;border:none;border-radius:10px;background:#1f7a4d;color:#fff;cursor:pointer;width:100%;margin-top:10px}
  input{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:14px;box-sizing:border-box}
  #log{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;margin-top:16px;font-size:13px;max-height:400px;overflow:auto}
</style>
</head>
<body>
  <h2>إضافة منيو البيتزا الكامل (مرة واحدة)</h2>
  <p>
    الصفحة دي بتدور على قسم "بيتزا" (اللي بيفتح صورة دلوقتي)، وبتحوّله لقسم أصناف عادي فيه 8 أقسام فرعية،
    وبتضيف الـ 28 صنف بيتزا اللي بعتهملك جوا الأقسام دي. تشغلها مرة واحدة بس.
  </p>
  <label>الإيميل</label><input id="email" type="email" placeholder="admin@example.com"/>
  <label>الباسورد</label><input id="password" type="password"/>
  <button id="runBtn">سجل دخول وابدأ</button>
  <div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// نفس إعدادات firebase-app.js بالظبط
const firebaseConfig = {
  apiKey: "AIzaSyCde_rpDGJI8HIr03a1eKaRzPFPo3mrRjI",
  authDomain: "anwarlebanonbakery-5815b.firebaseapp.com",
  projectId: "anwarlebanonbakery-5815b",
  storageBucket: "anwarlebanonbakery-5815b.firebasestorage.app",
  messagingSenderId: "301016473650",
  appId: "1:301016473650:web:1fc3fb5ced7b446cd19c2b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const logEl = document.getElementById('log');
const log = (msg) => { logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; };

const IMG_BASE = "https://raw.githubusercontent.com/anwarlebanonbakery/bakery-images/main/";
const img = (name) => IMG_BASE + name;

// ── الأقسام الفرعية الثمانية ──
const SECTIONS = [
  { id: 'cheese',  name: 'بيتزا الجبنة' },
  { id: 'meat',    name: 'بيتزا اللحوم' },
  { id: 'chicken', name: 'بيتزا الدجاج' },
  { id: 'sausage', name: 'بيتزا السجق واللحوم الباردة' },
  { id: 'seafood', name: 'بيتزا السي فود' },
  { id: 'veg',     name: 'بيتزا الخضار' },
  { id: 'special', name: 'بيتزا مميزة ومشكلة' },
  { id: 'sweet',   name: 'بيتزا حلوة' },
];

// ── الـ 28 صنف، كل واحد بقسمه الفرعي وسعر الوسط والكبير ──
const ITEMS = [
  // 🧀 بيتزا الجبنة
  { sec: 'cheese', name: 'ميكس جبنة',                 img: 'IMG-20260829-WA0001.jpg', mid: 25, big: 50 },
  { sec: 'cheese', name: 'جبنة كيري',                  img: 'IMG-20260829-WA0010.jpg', mid: 25, big: 50 },
  // 🥩 بيتزا اللحوم
  { sec: 'meat', name: 'لحم مفروم',                    img: 'IMG-20260829-WA0008.jpg', mid: 30, big: 55 },
  { sec: 'meat', name: 'لحم مفروم مع جبنة كيري',        img: 'IMG-20260829-WA0020.jpg', mid: 30, big: 55 },
  { sec: 'meat', name: 'لحم وخضار',                    img: 'IMG-20260829-WA0014.jpg', mid: 30, big: 55 },
  { sec: 'meat', name: 'لحم مع جبنة كيري',              img: 'IMG-20260829-WA0022.jpg', mid: 30, big: 55 },
  { sec: 'meat', name: 'لحم مدخن مع جبنة كيري',         img: 'IMG-20260829-WA0009.jpg', mid: 30, big: 50 },
  { sec: 'meat', name: 'شاورما لحم',                   img: 'IMG-20260829-WA0021.jpg', mid: 40, big: 65 },
  { sec: 'meat', name: 'فاهيتا لحم',                   img: 'IMG-20260829-WA0013.jpg', mid: 40, big: 65 },
  { sec: 'meat', name: 'التحدي (شاورما لحم + مشروم)',  img: 'IMG-20260829-WA0012.jpg', mid: 35, big: 55 },
  // 🍗 بيتزا الدجاج
  { sec: 'chicken', name: 'ناجتس دجاج',                img: 'IMG-20260829-WA0015.jpg', mid: 40, big: 60 },
  { sec: 'chicken', name: 'فاهيتا دجاج',                img: 'IMG-20260829-WA0000.jpg', mid: 40, big: 60 },
  { sec: 'chicken', name: 'شاورما دجاج',                img: 'IMG-20260829-WA0002.jpg', mid: 30, big: 50 },
  // 🌭 بيتزا السجق واللحوم الباردة
  { sec: 'sausage', name: 'سجق مع خضار',                img: 'IMG-20260829-WA0006.jpg', mid: 25, big: 50 },
  { sec: 'sausage', name: 'سجق مع فلفل حار',            img: 'IMG-20260829-WA0011.jpg', mid: 25, big: 50 },
  { sec: 'sausage', name: 'بسترمة مع خضار وزيتون',      img: 'IMG-20260829-WA0017.jpg', mid: 35, big: 60 },
  { sec: 'sausage', name: 'بيبروني',                    img: 'IMG-20260829-WA0027.jpg', mid: 25, big: 55 },
  { sec: 'sausage', name: 'مرتديلا',                    img: 'IMG-20260829-WA0007.jpg', mid: 35, big: 55 },
  { sec: 'sausage', name: 'سجق مع جبنة كيري',           img: 'IMG-20260829-WA0023.jpg', mid: 30, big: 55 },
  { sec: 'sausage', name: 'سجق مع جبنة رومي',           img: 'IMG-20260829-WA0025.jpg', mid: 25, big: 50 },
  { sec: 'sausage', name: 'بسترمة مع سجق',              img: 'IMG-20260829-WA0026.jpg', mid: 30, big: 50 },
  // 🦐 بيتزا السي فود
  { sec: 'seafood', name: 'سي فود وربيان',              img: 'IMG-20260829-WA0005.jpg', mid: 30, big: 50 },
  { sec: 'seafood', name: 'سي فود',                     img: 'IMG-20260829-WA0024.jpg', mid: 40, big: 65 },
  // 🥦 بيتزا الخضار
  { sec: 'veg', name: 'خضار مع هوت دوغ',                img: 'IMG-20260829-WA0004.jpg', mid: 25, big: 50 },
  { sec: 'veg', name: 'خضار مشكل',                     img: 'IMG-20260829-WA0019.jpg', mid: 20, big: 40 },
  // ⭐ بيتزا مميزة ومشكلة
  { sec: 'special', name: 'المجموعة (4 نكهات)',         img: 'IMG-20260829-WA0018.jpg', mid: 40, big: 60 },
  { sec: 'special', name: 'سوبر سوبريم',                img: 'IMG-20260829-WA0016.jpg', mid: 40, big: 65 },
  // 🍯 بيتزا حلوة
  { sec: 'sweet', name: 'عش البلبل (لبنة وعسل)',        img: 'IMG-20260829-WA0003.jpg', mid: 35, big: 55 },
];

document.getElementById('runBtn').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    log("✅ تم تسجيل الدخول");
  } catch (e) {
    log("❌ فشل تسجيل الدخول: " + e.message);
    return;
  }

  // ── دور على قسم "بيتزا" ──
  log("🔎 بدور على قسم البيتزا...");
  const catsSnap = await getDocs(collection(db, "categories"));
  let pizzaDoc = null;
  catsSnap.forEach(d => {
    const data = d.data();
    if ((data.name || '').includes('بيتزا')) pizzaDoc = { id: d.id, ...data };
  });

  if (!pizzaDoc) {
    log("❌ مالقتش قسم اسمه فيه 'بيتزا'. افتحي لوحة الأدمن وشوفي اسم القسم بالظبط، وابعتيهولي لو مختلف.");
    return;
  }
  log(`✅ لقيت القسم: "${pizzaDoc.name}" (${pizzaDoc.id})`);

  // ── تحقق إننا مش هنكرر الإضافة لو الصفحة اتشغلت قبل كده ──
  const existingProdsSnap = await getDocs(query(collection(db, "products"), where("categoryId", "==", pizzaDoc.id)));
  if (existingProdsSnap.size > 0) {
    log(`⚠️ القسم ده فيه بالفعل ${existingProdsSnap.size} صنف. لو كملتي هيتضاف الـ 28 صنف فوقهم (ممكن يبقوا مكررين).`);
    if (!confirm(`القسم فيه ${existingProdsSnap.size} صنف بالفعل. متأكد عايز تكمل وتضيف الـ 28 صنف الجداد؟`)) {
      log("⏹ اتوقف بناءً على طلبك.");
      return;
    }
  }

  // ── حوّل القسم من نوع "صورة" لنوع "قسم أصناف" وضيف الأقسام الفرعية ──
  await updateDoc(doc(db, "categories", pizzaDoc.id), {
    displayType: 'category',
    menuImageUrl: '',
    sections: SECTIONS,
    updatedAt: serverTimestamp(),
  });
  log("✅ اتحول القسم لقسم أصناف عادي (اتشالت الصورة) وانضافله 8 أقسام فرعية");

  // ── ضيف الأصناف الـ 28 ──
  let order = existingProdsSnap.size;
  for (const it of ITEMS) {
    await addDoc(collection(db, "products"), {
      name: it.name,
      categoryId: pizzaDoc.id,
      sectionId: it.sec,
      imageUrl: img(it.img),
      sizePrices: [
        { name: 'وسط', price: it.mid },
        { name: 'كبير', price: it.big },
      ],
      price: null,
      description: '',
      flavors: [],
      sizes: [],
      manaeshTypes: [],
      wide: false,
      tall: false,
      displayOrder: order++,
      visible: true,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
    log(`✅ ${it.name}`);
  }

  log(`🎉 خلصنا! اتضاف ${ITEMS.length} صنف بيتزا في 8 أقسام فرعية. افتحي الموقع وجربي.`);
};
</script>
</body>
</html>
