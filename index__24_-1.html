function mergeHomeContent(saved) {

async function loadHomeContent() {

        if (firebaseReady) {
            const doc = await firestore.collection("settings").doc("home").get();
            if (doc.exists) homeContentCache = mergeHomeContent(doc.data());
            else homeContentCache = DEFAULT_HOME_CONTENT;
        } else {
            homeContentCache = mergeHomeContent(safeRead(LOCAL_HOME_CONTENT_KEY, null));
        }
    } catch (e) {

    }
    return homeContentCache;
}

    const next = mergeHomeContent(content);

    return next;
}
