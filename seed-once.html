document.getElementById('runBtn').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    log("✅ تم تسجيل الدخول، بدء الترحيل...");
  } catch (e) {
    log("❌ فشل تسجيل الدخول: " + e.message);
    return;
  }

  let catOrder = 0;
  for (const card of DEFAULT_HOME_CARDS) {
    const isImageType = card.type === 'image';
    const catRef = await addDoc(collection(db, "categories"), {
      name: card.label,
      imageUrl: card.img,
      displayType: isImageType ? 'image' : 'category',
      menuImageUrl: isImageType ? (card.menuImg || '') : '',
      displayOrder: catOrder++,
      visible: true,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
    log(`✅ قسم: ${card.label}`);

    const catData = DEFAULT_CATEGORIES[card.id];
    if (catData && catData.items) {
      let prodOrder = 0;
      for (const item of catData.items) {
        await addDoc(collection(db, "products"), {
          name: item.name,
          categoryId: catRef.id,
          imageUrl: item.img,
          price: item.price !== undefined ? item.price : null,
          description: item.note || '',
          flavors: item.flavors || [],
          sizes: item.sizes || [],
          manaeshTypes: item.manaeshTypes || [],
          wide: !!item.wide,
          tall: !!item.tall,
          displayOrder: prodOrder++,
          visible: true,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        });
      }
      log(`   ↳ ${catData.items.length} صنف اتضافوا`);
    }
  }
  log("🎉 خلصنا! افتح لوحة الأدمن في الملف الرئيسي وشوف البيانات.");
};
